# Projects shown on /projects/. Rendered by the "projects" shortcode.

[[projects]]
  name = "helm-secrets"
  repo = "jkroepke/helm-secrets"
  icon = "fas fa-user-secret"
  role = "Author"
  language = "Shell"
  tags = ["Helm", "sops", "Argo CD"]
  docs = "https://github.com/jkroepke/helm-secrets/wiki"
  summary = "Helm plugin that decrypts sops or vals encrypted values files on the fly. Keep secrets in Git, next to your charts. Works with Helm, Helmfile and Argo CD."
  opinion = "Secrets in Git are fine when they are encrypted. Secrets in a wiki page are not."

[[projects]]
  name = "openvpn-auth-oauth2"
  repo = "jkroepke/openvpn-auth-oauth2"
  icon = "fas fa-shield-halved"
  role = "Author"
  language = "Go"
  tags = ["OpenVPN", "OIDC", "SSO"]
  docs = "https://github.com/jkroepke/openvpn-auth-oauth2/wiki"
  summary = "Single sign-on for the OpenVPN server. Users log in with Entra ID, Keycloak or any other OIDC provider, and you get MFA and conditional access for free."
  opinion = "Static VPN passwords should have died years ago."

[[projects]]
  name = "windows_exporter"
  repo = "prometheus-community/windows_exporter"
  icon = "fab fa-windows"
  role = "Maintainer"
  language = "Go"
  tags = ["Prometheus", "Windows", "Monitoring"]
  summary = "The Prometheus exporter for Windows machines. Think node_exporter, but for Windows hosts and Windows nodes in Kubernetes."
  opinion = "Windows nodes still exist. They need monitoring, too."

[[projects]]
  name = "access-log-exporter"
  repo = "jkroepke/access-log-exporter"
  icon = "fas fa-chart-line"
  role = "Author"
  language = "Go"
  tags = ["Prometheus", "nginx", "syslog"]
  docs = "https://github.com/jkroepke/access-log-exporter/wiki"
  summary = "Receives nginx access logs over syslog and turns them into Prometheus metrics: request rates, status codes and latencies."
  opinion = "You do not need a log pipeline to count HTTP 500s."

[[projects]]
  name = "lens-extension-certificate-info"
  repo = "jkroepke/lens-extension-certificate-info"
  icon = "fas fa-certificate"
  role = "Author"
  language = "TypeScript"
  tags = ["Lens", "Kubernetes", "TLS"]
  summary = "Lens extension that shows the expiry date of certificates stored in Kubernetes secrets."
  opinion = "Expired certificates are the most boring outage there is."

