name: CI

on:
  push:
    branches:
      - main

  # All pull requests, also the ones stacked on another pull request branch.
  pull_request:

  workflow_dispatch:

permissions: {}

# One run per branch at a time, so pull requests do not queue behind each
# other or behind the Pages deployment of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    env:
      HUGO_ENVIRONMENT: production
      TZ: Europe/Berlin
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # tabernetes/mise.toml inherits the root mise.toml, so this installs the site
      # tools (node, hugo, sass) and the tabernetes tools (go) in one go.
      - name: Setup mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          working_directory: tabernetes

      - name: Install frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Cache Restore
        id: cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: hugo-${{ github.run_id }}
          restore-keys:
            hugo-
      
      - name: Configure Git
        run: git config core.quotepath false

      - name: Cache tabernetes
        id: cache-tabernetes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            assets/tabernetes/tabernetes.wasm.zst
            tabernetes/.build/wasm_exec.js
          key: tabernetes-${{ hashFiles('tabernetes/mise.toml', 'tabernetes/k8s/**') }}

      # The kernel, init and BIOS for container images on tab nodes. The vm
      # task rebuilds them (with docker) only when tabernetes/vm/ changed.
      - name: Cache tabernetes VM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: assets/tabernetes/vm
          key: tabernetes-vm-${{ hashFiles('tabernetes/vm/**') }}

      - name: Build tabernetes
        working-directory: tabernetes
        run: mise run "${TARGET}"
        env:
          # on a cache hit only the (cheap) web part is rebuilt
          TARGET: ${{ steps.cache-tabernetes.outputs.cache-hit == 'true' && 'web' || 'build' }}

      # Only when the wasm was rebuilt: the cache key covers everything the
      # tests check (tabernetes/k8s/**, tabernetes/mise.toml).
      - name: Test tabernetes
        if: steps.cache-tabernetes.outputs.cache-hit != 'true'
        working-directory: tabernetes
        run: mise run test
      
      # go mod tidy (e.g. from Renovate) drops the theme because no Go code
      # imports it. Hugo then silently falls back to an old LoveIt release.
      - name: Check Hugo module requirement
        run: |
          if ! grep -q '^require github.com/dillonzq/LoveIt ' go.mod; then
            echo "::error file=go.mod::the LoveIt requirement is missing, go mod tidy removed it"
            exit 1
          fi

      - name: Build with Hugo
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${BASE_URL}" \
            --cacheDir "${RUNNER_TEMP}/hugo_cache"
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}/
          RUNNER_TEMP: ${{ runner.temp }}
      
      - name: Cache Save
        if: github.ref_name == 'main'
        id: cache-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/hugo_cache
          key: ${{ steps.cache-restore.outputs.cache-primary-key }}
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  lint:
    name: Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Lint Code Base
        uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MULTI_STATUS: false
          LINTER_RULES_PATH: .github/linters
          ENABLE_GITHUB_ACTIONS_STEP_SUMMARY: true
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: false
          SAVE_SUPER_LINTER_SUMMARY: true
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_BASH: true
          VALIDATE_BASH_EXEC: true
          VALIDATE_EDITORCONFIG: true
          VALIDATE_ENV: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: true
          VALIDATE_GITLEAKS: true
          VALIDATE_HTML: true
          VALIDATE_JSON: true
          VALIDATE_NATURAL_LANGUAGE: true
          VALIDATE_MARKDOWN: true
          VALIDATE_RENOVATE: true
          VALIDATE_SHELL_SHFMT: true
          # Hugo layout templates contain Go template syntax and are not standalone HTML documents.
          FILTER_REGEX_EXCLUDE: ^layouts/.*[.](html|md)$
          STRIP_DEFAULT_WORKSPACE_FOR_REGEX: true
  deploy:
    if: github.repository_owner == 'jkroepke' && github.ref_name == 'main'
    name: Deploy
    permissions:
      contents: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-26.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
