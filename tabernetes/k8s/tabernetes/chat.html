<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Model}}</title>
<style>
:root { color-scheme: light dark; --bg: #fff; --fg: #1d1d1f; --dim: #6e6e73; --me: #e8f0fe; --line: #d2d2d7; --accent: #326ce5; }
@media (prefers-color-scheme: dark) { :root { --bg: #161618; --fg: #e8e8ed; --dim: #98989d; --me: #1f2a44; --line: #38383c; --accent: #6d9bff; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
header { padding: 12px 16px; border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 1rem; }
header p { margin: 0; color: var(--dim); font-size: .85rem; }
#log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; max-width: 800px; width: 100%; margin: 0 auto; }
.msg { white-space: pre-wrap; overflow-wrap: anywhere; padding: 8px 12px; border-radius: 12px; max-width: 85%; }
.user { align-self: flex-end; background: var(--me); }
.assistant { align-self: flex-start; border: 1px solid var(--line); }
.assistant.wait { color: var(--dim); }
.error { align-self: flex-start; color: #d70015; }
form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); max-width: 800px; width: 100%; margin: 0 auto; }
textarea { flex: 1; resize: none; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: transparent; color: inherit; font: inherit; }
button { padding: 8px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>{{.Model}}</h1>
  <p>runs on the GPU of a browser tab with WebGPU (WebLLM), behind the OpenAI API at <code>/v1/chat/completions</code></p>
</header>
<div id="log"></div>
<form id="form">
  <textarea id="input" rows="2" placeholder="Message (Enter sends, Shift+Enter for a new line)" autofocus></textarea>
  <button id="send">Send</button>
</form>
<script>
const model = {{.Model}};
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const messages = [];

function add(cls, text) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.append(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

// The proxy of the page hands over a response only once it is complete, so
// the answer comes in one piece, not streamed.
async function ask(text) {
  messages.push({ role: "user", content: text });
  add("user", text);
  const answer = add("assistant wait", "…");
  try {
    const r = await fetch("v1/chat/completions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ model, messages }),
    });
    const body = await r.json();
    if (!r.ok || body.error) throw new Error(body.error?.message || r.statusText);
    const content = body.choices?.[0]?.message?.content ?? "";
    messages.push({ role: "assistant", content });
    answer.className = "msg assistant";
    answer.textContent = content;
  } catch (err) {
    messages.pop();
    answer.className = "msg error";
    answer.textContent = String(err.message || err);
  }
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;
  input.value = "";
  send.disabled = true;
  await ask(text);
  send.disabled = false;
  input.focus();
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>
</body>
</html>
